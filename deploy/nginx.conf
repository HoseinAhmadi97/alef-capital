# ════════════════════════════════════════════════════════════════
#  Alef Capital — nginx server block
#
#  Use this when nginx is already running on the server
#  (for Grafana or another service) and ports 80/443 are not free.
#  In that case Caddy/Docker is not needed.
#
#  Install:
#    sudo ln -sfn /srv/alef-capital/dist /srv/site
#    sudo cp deploy/nginx.conf /etc/nginx/sites-available/alefcapital.ir
#    sudo ln -s /etc/nginx/sites-available/alefcapital.ir /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#
#  HTTPS (once the A records have propagated):
#    sudo certbot --nginx -d alefcapital.ir -d www.alefcapital.ir
#  certbot adds listen 443 and the certificate paths to this file itself.
# ════════════════════════════════════════════════════════════════

# Live gold data from Nexus (see docs/gold-data-map.md). One cached copy
# is shared by every visitor for 5 s, so Nexus answers at most one request
# per 5 s whatever the traffic. The cache directory is created by nginx.
proxy_cache_path /var/cache/nginx/alef-api levels=1 keys_zone=alef_api:1m
                 max_size=10m inactive=10m use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name alefcapital.ir www.alefcapital.ir;

    root /srv/site;
    index index.html;

    # ── security ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options       "SAMEORIGIN" always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy    "geolocation=(), microphone=(), camera=()" always;

    # HTML is not cached, so your changes show up immediately
    add_header Cache-Control         "no-cache, must-revalidate" always;

    # ── compression ── roughly 55KB → 12KB
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # fonts and images are cached for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # One address per page. The site links to /pricing; anyone arriving at
    # /pricing.html (an old link, a bookmark) is sent to the clean one, so
    # search engines never see the same page under two URLs.
    location ~ ^/(.+)\.html$ {
        return 301 /$1;
    }
    location = /index.html { return 301 /; }

    # and the clean address resolves to the file:  /pricing → /pricing.html
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }

    # ── live gold data ── the one Nexus endpoint the site reads (site/config.py
    # GOLD_API). Exact match: nothing else of Nexus is exposed to the internet.
    location = /api/gold/snapshot {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8100/v1/gold/snapshot;
        proxy_set_header Host $host;
        # nginx compresses (gzip_types has application/json), so the cache
        # holds one plain copy instead of one per Accept-Encoding
        proxy_set_header Accept-Encoding "";

        proxy_cache alef_api;
        proxy_cache_valid 200 5s;
        # one upstream fetch per expiry — not one per visitor waiting on it
        proxy_cache_lock on;
        proxy_cache_background_update on;
        # if Nexus is down or restarting, keep serving the last snapshot
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

        # an add_header here stops the server-level ones being inherited,
        # which is wanted: Nexus's own Cache-Control/ETag must reach the browser
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Cache $upstream_cache_status always;
    }
}
