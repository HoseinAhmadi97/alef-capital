# ════════════════════════════════════════════════════════════════
#  الف کپیتال — بلوک nginx
#
#  وقتی استفاده می‌شود که روی سرور از قبل nginx بالاست
#  (مثلاً برای grafana یا سرویس دیگری) و پورت ۸۰/۴۴۳ آزاد نیست.
#  در این حالت Caddy/Docker لازم نیست.
#
#  نصب:
#    sudo ln -sfn /srv/alef-capital/dist /srv/site
#    sudo cp deploy/nginx.conf /etc/nginx/sites-available/alefcapital.ir
#    sudo ln -s /etc/nginx/sites-available/alefcapital.ir /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#
#  HTTPS (بعد از اینکه رکوردهای A منتشر شدند):
#    sudo certbot --nginx -d alefcapital.ir -d www.alefcapital.ir
#  certbot خودش listen 443 و مسیر گواهی را به همین فایل اضافه می‌کند.
# ════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name alefcapital.ir www.alefcapital.ir;

    root /srv/site;
    index index.html;

    # ── امنیت ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options       "SAMEORIGIN" always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy    "geolocation=(), microphone=(), camera=()" always;

    # HTML کش نمی‌شود تا تغییرات شما بلافاصله دیده شود
    add_header Cache-Control         "no-cache, must-revalidate" always;

    # ── فشرده‌سازی ── حدود ۵۵KB → ۱۲KB
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # فونت و تصویر یک سال کش می‌شوند
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # آدرس بدون .html هم کار کند:  /pricing → /pricing.html
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }
}

