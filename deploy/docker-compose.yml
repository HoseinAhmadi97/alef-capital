# ════════════════════════════════════════════════════════════════
#  Run:   docker compose -f deploy/docker-compose.yml up -d
#
#  The point that keeps your iteration fast:
#  dist/ is bind-mounted as a volume, it is not baked into the image.
#  So to see a change you only run `make build` —
#  no image rebuild, no container restart.
# ════════════════════════════════════════════════════════════════
services:
  caddy:
    image: caddy:2-alpine
    container_name: alef-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"          # HTTP/3
    volumes:
      - ../dist:/srv/site:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # TLS certificates — must be kept
      - caddy_config:/config
      - caddy_logs:/var/log/caddy

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
